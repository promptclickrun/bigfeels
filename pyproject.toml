[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigfeels-mem"
version = "0.1.0"
description = "Local, evidence-based memory across agent runtimes"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = []

[project.scripts]
bigfeels-mem = "bigfeels_mem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bigfeels_mem = ["static/*"]
