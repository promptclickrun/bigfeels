name: Test bigfeels
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build
      - name: Python tests
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Node tests
        run: python -c "import glob,os,subprocess,sys; subprocess.check_call(['node','--test','adapters/openclaw/test.mjs','adapters/openclaw/tools.test.mjs',*sorted(glob.glob('tests/*.test.mjs'))],env={**os.environ,'BIGFEELS_TEST_PYTHON':sys.executable})"
      - name: Replay benchmark
        env:
          PYTHONPATH: src
        run: python benchmarks/replay.py
      - run: python -m build
      - name: Install built wheel
        run: python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable,'-m','pip','install',wheels[0]])"
      - name: Verify installed wheel launches
        run: |
          bigfeels-mem --help
          python -m bigfeels_mem.cli --help
          python -m bigfeels_mem.cli --data-dir "CI Data With Spaces" mcp --explicit-only --help
